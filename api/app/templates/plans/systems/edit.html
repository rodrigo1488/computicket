{% extends 'base.html' %}
{% block page_title %}✏️ Editar Sistema - {{ system.name }}{% endblock %}
{% block content %}

<div class="bg-secondary rounded-lg shadow-lg p-6 mb-6">
	<div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
		<div class="flex-1">
			<h1 class="text-2xl lg:text-3xl font-bold text-primary mb-2">
				✏️ Editar Sistema
			</h1>
		</div>
		<div class="flex-shrink-0">
			<a href="{{ url_for('plans.view_system', system_id=system.id) }}" class="btn btn-secondary">
				<i class="fas fa-arrow-left mr-2"></i>
				Voltar
			</a>
		</div>
	</div>
</div>

<div class="bg-secondary rounded-lg shadow-lg p-6">
	<form method="post" class="space-y-6">
		<div class="bg-tertiary rounded-lg p-4">
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div class="form-group">
					<label class="form-label">Nome *</label>
					<input type="text" name="name" class="form-input" required value="{{ request.form.get('name', system.name) }}">
				</div>
				<div class="form-group">
					<label class="form-label">Versão</label>
					<input type="text" name="version" class="form-input" value="{{ request.form.get('version', system.version or '') }}">
				</div>
			</div>
			<div class="form-group">
				<label class="form-label">Empresa</label>
				<input type="text" name="company" class="form-input" value="{{ request.form.get('company', system.company or '') }}">
			</div>
			<div class="form-group">
				<label class="form-label">Descrição</label>
				<textarea name="description" class="form-textarea" rows="3">{{ request.form.get('description', system.description or '') }}</textarea>
			</div>
			<label class="flex items-center"><input type="checkbox" name="is_active" class="form-checkbox mr-2" {{ 'checked' if (request.form.get('is_active') == 'on') or system.is_active else '' }}>Sistema ativo</label>
		</div>

		<div class="flex flex-col sm:flex-row items-center gap-3 justify-end">
			<a href="{{ url_for('plans.view_system', system_id=system.id) }}" class="btn btn-secondary w-full sm:w-auto">
				<i class="fas fa-times mr-2"></i>
				Cancelar
			</a>
			<button type="submit" class="btn btn-primary w-full sm:w-auto">
				<i class="fas fa-save mr-2"></i>
				Salvar Alterações
			</button>
		</div>
	</form>
</div>

{% endblock %}
