<!-- Notificação flutuante do Help Desk -->
<div id="helpdesk-notification" class="helpdesk-notification" style="display: none;">
    <div class="notification-content">
        <div class="notification-icon">
            <i class="fas fa-comments"></i>
        </div>
        <div class="notification-body">
            <div class="notification-title">Nova Mensagem</div>
            <div class="notification-message" id="notification-message"></div>
            <div class="notification-client" id="notification-client"></div>
            <div class="notification-time" id="notification-time"></div>
        </div>
        <div class="notification-actions">
            <button class="notification-btn notification-btn-primary" onclick="goToHelpDesk()">
                <i class="fas fa-external-link-alt"></i>
            </button>
            <button class="notification-btn notification-btn-close" onclick="closeNotification()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <div class="notification-progress">
        <div class="notification-progress-bar"></div>
    </div>
</div>

<style>
.helpdesk-notification {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 350px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    z-index: 10000;
    transform: translateX(100%);
    transition: transform 0.3s ease-in-out;
    overflow: hidden;
}

.helpdesk-notification.show {
    transform: translateX(0);
}

.notification-content {
    display: flex;
    align-items: flex-start;
    padding: 16px;
    gap: 12px;
}

.notification-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
}

.notification-body {
    flex: 1;
    min-width: 0;
}

.notification-title {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 4px;
}

.notification-message {
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 4px;
    word-wrap: break-word;
}

.notification-client {
    color: var(--accent-primary);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 2px;
}

.notification-time {
    color: var(--text-secondary);
    font-size: 11px;
    opacity: 0.8;
}

.notification-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
}

.notification-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 12px;
}

.notification-btn-primary {
    background: var(--accent-primary);
    color: white;
}

.notification-btn-primary:hover {
    background: var(--accent-secondary);
    transform: scale(1.05);
}

.notification-btn-close {
    background: var(--bg-primary);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
}

.notification-btn-close:hover {
    background: var(--bg-primary);
    color: var(--text-primary);
    border-color: var(--accent-primary);
}

.notification-progress {
    height: 3px;
    background: var(--bg-primary);
    overflow: hidden;
}

.notification-progress-bar {
    height: 100%;
    background: var(--accent-primary);
    width: 100%;
    transform: translateX(-100%);
    transition: transform 3s linear;
}

.helpdesk-notification.show .notification-progress-bar {
    transform: translateX(0);
}

/* Animações */
@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOutRight {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(100%);
        opacity: 0;
    }
}

.helpdesk-notification.slide-in {
    animation: slideInRight 0.3s ease-out;
}

.helpdesk-notification.slide-out {
    animation: slideOutRight 0.3s ease-in;
}

/* Responsividade */
@media (max-width: 480px) {
    .helpdesk-notification {
        width: calc(100vw - 40px);
        right: 20px;
        left: 20px;
    }
}
</style>

<script>
// Variáveis globais para controle da notificação
let notificationTimeout = null;
let notificationProgressTimeout = null;

// Função para mostrar notificação
function showHelpDeskNotification(data) {
    // Verificar se estamos na página do help desk
    if (window.location.pathname.includes('/helpdesk')) {
        return; // Não mostrar notificação se estiver no help desk
    }
    
    const notification = document.getElementById('helpdesk-notification');
    const messageEl = document.getElementById('notification-message');
    const clientEl = document.getElementById('notification-client');
    const timeEl = document.getElementById('notification-time');
    
    if (!notification) return;
    
    // Preencher dados da notificação
    messageEl.textContent = data.message_preview || 'Nova mensagem recebida';
    clientEl.textContent = `De: ${data.client_name || 'Cliente'}`;
    timeEl.textContent = data.timestamp || new Date().toLocaleTimeString();
    
    // Limpar timeouts anteriores
    if (notificationTimeout) {
        clearTimeout(notificationTimeout);
    }
    if (notificationProgressTimeout) {
        clearTimeout(notificationProgressTimeout);
    }
    
    // Mostrar notificação
    notification.style.display = 'block';
    notification.classList.remove('slide-out');
    notification.classList.add('show', 'slide-in');
    
    // Iniciar barra de progresso
    const progressBar = notification.querySelector('.notification-progress-bar');
    progressBar.style.transform = 'translateX(-100%)';
    progressBar.style.transition = 'transform 3s linear';
    
    // Animar barra de progresso
    setTimeout(() => {
        progressBar.style.transform = 'translateX(0)';
    }, 100);
    
    // Auto-fechar após 3 segundos
    notificationTimeout = setTimeout(() => {
        closeNotification();
    }, 3000);
}

// Função para fechar notificação
function closeNotification() {
    const notification = document.getElementById('helpdesk-notification');
    if (!notification) return;
    
    // Limpar timeouts
    if (notificationTimeout) {
        clearTimeout(notificationTimeout);
        notificationTimeout = null;
    }
    if (notificationProgressTimeout) {
        clearTimeout(notificationProgressTimeout);
        notificationProgressTimeout = null;
    }
    
    // Animar saída
    notification.classList.remove('show', 'slide-in');
    notification.classList.add('slide-out');
    
    // Esconder após animação
    setTimeout(() => {
        notification.style.display = 'none';
        notification.classList.remove('slide-out');
    }, 300);
}

// Função para ir ao help desk
function goToHelpDesk() {
    window.location.href = '/helpdesk/';
}

// Event listener para fechar com ESC
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeNotification();
    }
});

// Event listener para fechar ao clicar fora
document.addEventListener('click', function(e) {
    const notification = document.getElementById('helpdesk-notification');
    if (notification && notification.style.display === 'block') {
        if (!notification.contains(e.target)) {
            closeNotification();
        }
    }
});
</script>
