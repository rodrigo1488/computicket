{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Importar Clientes (CSV)</h1>
<form method="post" enctype="multipart/form-data" class="space-y-4 bg-white p-4 rounded shadow">
	<label class="block">
		<span class="text-sm font-medium">Arquivo CSV</span>
		<input type="file" name="file" accept=".csv" required class="mt-1 w-full border rounded px-3 py-2">
	</label>
	<label class="block">
		<span class="text-sm font-medium">Tipo de contrato padrão</span>
		<select name="contract_type" class="mt-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
			<option value="mensal">Mensal</option>
			<option value="avulso">Avulso</option>
			<option value="outro">Outro</option>
		</select>
	</label>
	<p class="text-sm text-gray-600">Colunas esperadas: nome, telefone, cpf_cnpj (ou document)</p>
	<button type="submit" class="inline-flex items-center px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">Importar</button>
</form>
{% endblock %}
