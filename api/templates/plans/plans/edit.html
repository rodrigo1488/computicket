{% extends 'base.html' %}
{% block page_title %}✏️ Editar Plano - {{ plan.name }}{% endblock %}
{% block content %}

<div class="bg-secondary rounded-lg shadow-lg p-6 mb-6">
	<div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
		<div class="flex-1">
			<h1 class="text-2xl lg:text-3xl font-bold text-primary mb-2">
				✏️ Editar Plano
			</h1>
			<p class="text-secondary">
				Atualize as configurações do plano <strong>{{ plan.name }}</strong>
			</p>
		</div>
		<div class="flex-shrink-0">
			<a href="{{ url_for('plans.view_plan', plan_id=plan.id) }}" class="btn btn-secondary">
				<i class="fas fa-arrow-left mr-2"></i>
				Voltar
			</a>
		</div>
	</div>
</div>

<div class="bg-secondary rounded-lg shadow-lg p-6">
	<form method="post" class="space-y-6">
		{% include 'plans/plans/partials/_form_fields.html' %}
		<div class="flex flex-col sm:flex-row items-center gap-3 justify-end">
			<a href="{{ url_for('plans.view_plan', plan_id=plan.id) }}" class="btn btn-secondary w-full sm:w-auto">
				<i class="fas fa-times mr-2"></i>
				Cancelar
			</a>
			<button type="submit" class="btn btn-primary w-full sm:w-auto">
				<i class="fas fa-save mr-2"></i>
				Salvar Alterações
			</button>
		</div>
	</form>
</div>

{% endblock %}
