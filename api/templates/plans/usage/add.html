{% extends 'base.html' %}
{% block page_title %}➕ Adicionar Uso - {{ client_plan.client.name }}{% endblock %}
{% block content %}

<div class="bg-secondary rounded-lg shadow-lg p-6 mb-6">
	<h1 class="text-2xl font-bold text-primary">Adicionar Uso ao Plano</h1>
</div>

<div class="bg-secondary rounded-lg shadow-lg p-6">
	<form method="post" class="space-y-6">
		<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
			<div class="form-group">
				<label class="form-label">Horas Utilizadas</label>
				<input type="number" step="0.01" min="0.01" name="hours_used" class="form-input" required>
			</div>
			<div class="form-group">
				<label class="form-label">Mês/Ano (YYYY-MM)</label>
				<input type="text" name="month_year" class="form-input" placeholder="YYYY-MM" required>
			</div>
			<div class="form-group">
				<label class="form-label">Ticket (opcional)</label>
				<input type="number" name="ticket_id" class="form-input" placeholder="ID do ticket">
			</div>
		</div>
		<div class="flex items-center justify-end gap-3">
			<a href="{{ url_for('plans.view_usage', client_plan_id=client_plan.id) }}" class="btn btn-secondary"><i class="fas fa-times mr-2"></i>Cancelar</a>
			<button type="submit" class="btn btn-primary"><i class="fas fa-save mr-2"></i>Salvar</button>
		</div>
	</form>
</div>

{% endblock %}
