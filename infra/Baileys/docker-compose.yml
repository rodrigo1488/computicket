services:
  cache:
    image: redis:8.0.1
    restart: always
    ports:
      - "6379:6379"
    # Sem senha no local (bate com REDIS_URI sem password)
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app_network

  db_postgres:
    image: postgres:16.9
    restart: always
    environment:
      POSTGRES_PASSWORD: compumais
      POSTGRES_USER: compumais
      POSTGRES_DB: compumais
    # Host 1861 → Postgres interno 5432 (não mapear 1861:1861)
    ports:
      - "1861:5432"
    volumes:
      - compuchat_pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compumais -d compumais"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app_network:

volumes:
  compuchat_pgdata:
